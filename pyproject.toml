[project]
name = "scam-recovery-agent"
version = "0.1.0"
description = "Scam Recovery Commander (Digital Bodyguard) — AI agent for scam recovery coordination via email + Telegram"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
keywords = ["ai-agent", "caspian-sdk", "scam-recovery", "hackathon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "caspian-sdk>=0.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bodyguard = "bodyguard.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
lint.select = ["E", "F", "I", "N"]

[tool.hatch.build.targets.wheel]
packages = ["src/bodyguard"]
